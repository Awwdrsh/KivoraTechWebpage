<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta name="description" content="404 - the page you requested drifted out of orbit. Head back to Kivora Tech." />
<meta name="theme-color" content="#0a0a0b" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='4' fill='%230a0a0b'/%3E%3Crect x='2' y='2' width='60' height='60' rx='2' fill='none' stroke='%23b08947' stroke-width='2'/%3E%3Cpath d='M22 15 V49 M24 32 L40 15 M24 32 L40 49' stroke='%23c99a3f' stroke-width='7' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
<title>404 - Kivora Tech Pvt. Ltd.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0a0a0b;--tile:#161618;--line:rgba(255,255,255,.08);--text:#e8ecf1;--muted:#8a919d;--gold:#c99a3f;--gold-2:#e3c06a;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;line-height:1.6}
a{color:inherit;text-decoration:none}
.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(55% 45% at 18% 0%,rgba(201,154,63,.06),transparent 60%)}
.card{position:relative;z-index:1;width:min(520px,100%);background:var(--tile);border:1px solid var(--line);padding:clamp(36px,6vw,64px);text-align:center;animation:rise .8s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.code{font-size:clamp(88px,20vw,150px);font-weight:700;line-height:1;background:linear-gradient(135deg,var(--gold-2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.03em}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:26px 0 14px}
.eyebrow::before,.eyebrow::after{content:"";width:20px;height:2px;background:var(--gold)}
h1{font-size:clamp(22px,4.5vw,30px);font-weight:600;letter-spacing:-.02em;margin-bottom:12px}
p{color:var(--muted);font-size:14px;max-width:38ch;margin:0 auto 30px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 26px;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.04em;border:2px solid var(--gold);transition:background .25s,color .25s,transform .25s var(--ease)}
.btn-primary{color:#0a0a0b;background:var(--gold)}
.btn-primary:hover{background:var(--gold-2);transform:translateY(-2px)}
.btn-ghost{color:var(--gold);background:transparent}
.btn-ghost:hover{background:rgba(201,154,63,.1);transform:translateY(-2px)}
.home{display:inline-flex;align-items:center;gap:8px;margin-top:30px;color:var(--muted);font-size:13px;transition:color .3s}
.home:hover{color:var(--gold)}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<main class="card" role="main">
  <div class="code" aria-hidden="true">404</div>
  <div class="eyebrow">Signal lost</div>
  <h1>This page drifted out of orbit</h1>
  <p>The transmission you requested can't be found, it may have moved, or the coordinates were wrong. Mission control is standing by.</p>
  <div class="cta">
    <a class="btn btn-primary" href="/">Back to home <span aria-hidden="true">&rarr;</span></a>
    <a class="btn btn-ghost" href="/#contact">Get in touch</a>
  </div>
  <a class="home" href="/"><span aria-hidden="true">&larr;</span> Return to Kivora Tech</a>
</main>
</body>
</html>
