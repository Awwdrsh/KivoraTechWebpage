<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta name="description" content="404 — the page you requested drifted out of orbit. Head back to Kivora Tech." />
<meta name="theme-color" content="#f7f4ee" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316161c'/%3E%3Crect x='3' y='3' width='58' height='58' rx='11' fill='none' stroke='%233c3c46'/%3E%3Cpath d='M22 15 V49 M24 32 L40 15 M24 32 L40 49' stroke='%23d8dde6' stroke-width='7' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
<title>404 — Kivora Tech Pvt. Ltd.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f7f4ee;
  --tile:#fffdf9;
  --tile-2:#faf5ea;
  --line:rgba(138,100,32,.14);
  --text:#221d15;
  --muted:#74695a;
  --gold:#a87d2c;
  --gold-2:#c99a3f;
  --grad:linear-gradient(120deg,#e3c06a,#a87d2c 45%,#8a6420);
  --radius:20px;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:clip}
body{
  font-family:'Sora',system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100svh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;-webkit-font-smoothing:antialiased;line-height:1.6;
}
a{color:inherit;text-decoration:none}
.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(55% 45% at 18% 0%,rgba(201,154,63,.16),transparent 60%),
    radial-gradient(45% 40% at 85% 12%,rgba(168,125,44,.1),transparent 60%)}
.card{position:relative;z-index:1;width:min(520px,100%);border-radius:var(--radius);
  background:linear-gradient(180deg,var(--tile),var(--tile-2));
  border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(120,90,30,.06),0 24px 60px -28px rgba(120,90,30,.35);
  padding:clamp(36px,6vw,64px);text-align:center;
  animation:rise .8s var(--ease) both}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(420px circle at 50% 0%,rgba(227,192,106,.18),transparent 65%)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.code{font-family:'Space Grotesk',sans-serif;font-size:clamp(88px,20vw,150px);font-weight:700;
  line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:-.03em}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.32em;
  text-transform:uppercase;color:var(--gold);margin:26px 0 14px}
.eyebrow::before,.eyebrow::after{content:"";width:24px;height:1px;background:var(--gold);opacity:.8}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(22px,4.5vw,30px);font-weight:600;
  letter-spacing:-.02em;margin-bottom:12px}
p{color:var(--muted);font-size:14.5px;max-width:38ch;margin:0 auto 30px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 26px;border-radius:99px;
  font-weight:600;font-size:14px;border:1px solid transparent;transition:transform .4s var(--ease),box-shadow .4s,border-color .3s}
.btn-primary{color:#241a04;background:linear-gradient(160deg,#e9c873,var(--gold-2) 45%,var(--gold));
  box-shadow:0 14px 30px -12px rgba(168,125,44,.55)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 20px 42px -14px rgba(168,125,44,.65)}
.btn-ghost{color:var(--text);border-color:var(--line);background:rgba(255,255,255,.5);backdrop-filter:blur(6px)}
.btn-ghost:hover{border-color:rgba(168,125,44,.5);transform:translateY(-2px)}
.home{display:inline-flex;align-items:center;gap:8px;margin-top:30px;color:var(--muted);
  font-size:13px;transition:color .3s}
.home:hover{color:var(--gold)}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<main class="card" role="main">
  <div class="code" aria-hidden="true">404</div>
  <div class="eyebrow">Signal lost</div>
  <h1>This page drifted out of orbit</h1>
  <p>The transmission you requested can't be found — it may have moved, or the coordinates were wrong. Mission control is standing by.</p>
  <div class="cta">
    <a class="btn btn-primary" href="/">Back to home <span aria-hidden="true">→</span></a>
    <a class="btn btn-ghost" href="/#contact">Get in touch</a>
  </div>
  <a class="home" href="/"><span aria-hidden="true">←</span> Return to Kivora Tech</a>
</main>
</body>
</html>
